name: Android CI
on:
  push:
    branches: [ main, dev/foundation ]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :core-model:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-WiFi-Call-debug
          path: app/build/outputs/apk/debug/app-debug.apk
