name: Android CI
on:
  push:
    branches: [ main, dev/foundation ]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - run: python3 scripts/validate_resources.py
      - run: gradle :core-model:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-WiFi-Call-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  ui-check:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_ui_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-WiFi-Call-ui-verification
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
